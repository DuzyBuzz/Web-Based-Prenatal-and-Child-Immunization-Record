<!-- Sidebar for desktop and tablet -->
<div
  class="hidden md:flex flex-col fixed top-0 left-0 h-screen w-64 bg-white border-r border-gray-200 z-50 overflow-y-auto"
>
  <!-- Logo -->
  <div class="flex flex-col items-center py-6 px-4">
    <img
      src="assets/images/immune-system.png"
      alt="PCIRM Logo"
      class="w-14 h-14 object-contain rounded-full bg-gradient-to-br from-gray-400 to-gray-200 shadow-xl border-4 border-white"
    />
    <h1 class="text-2xl font-black text-gray-800 mt-2">ADMIN PANEL</h1>
    <p class="text-base text-gray-600 text-center leading-relaxed font-bold mt-2">
      Web-Based Prenatal &amp;<br>
      Child Immunization Records<br>
      with SMS Notification
    </p>
  </div>
  <!-- Navigation -->
  <nav class="flex-1 flex flex-col justify-between px-4 pb-6">
    <div class="flex flex-col gap-2">
      <button routerLink="/Admin/Dashboard"
        class="flex items-center px-4 py-3 text-gray-800 font-semibold bg-gradient-to-r from-gray-100 to-gray-300 hover:from-gray-200 hover:to-gray-400 transition-all shadow border border-gray-200 rounded">
        <span class="material-icons mr-2 text-gray-500">dashboard</span>
        Dashboard
      </button>
      <button routerLink="/Admin/Users" routerLinkActive="active"
        class="flex items-center px-4 py-3 text-gray-800 font-semibold bg-gradient-to-r from-gray-100 to-gray-300 hover:from-gray-200 hover:to-gray-400 transition-all shadow border border-gray-200 rounded">
        <span class="material-icons mr-2 text-gray-500">group</span>
        Users
      </button>
      <button routerLink="/Admin/Reports" routerLinkActive="active"
        class="flex items-center px-4 py-3 text-gray-800 font-semibold bg-gradient-to-r from-gray-200 to-gray-100 hover:from-gray-300 hover:to-gray-200 transition-all shadow border border-gray-300 rounded">
        <span class="material-icons mr-2 text-gray-500">bar_chart</span>
        Reports
      </button>
    </div>
    <div class="flex flex-col gap-2 mt-8">
      <button (click)="logout()"
        class="flex items-center px-4 py-3 text-gray-600 hover:text-black font-semibold bg-gradient-to-r from-gray-200 to-gray-100 hover:from-gray-400 hover:to-gray-200 transition-all shadow border border-gray-300 rounded">
        <span class="material-icons mr-2 text-gray-600">logout</span>
        Signout
      </button>
    </div>
  </nav>
</div>

<!-- Sidebar for mobile -->
<div class="md:hidden">
  <!-- Sidebar Toggle Button -->
  <button
    (click)="toggleMobileMenu()"
    class="fixed top-2 left-2 z-50 bg-gradient-to-br from-gray-600 to-gray-400 text-white p-2 rounded-full shadow-lg flex items-center justify-center"
    aria-label="Toggle navigation"
  >
    <img src="assets/images/immune-system.png" alt="Menu" class="w-6 h-6 object-contain" />
  </button>

  <!-- Overlay -->
  <div
    *ngIf="mobileMenuOpen"
    class="fixed inset-0 bg-black bg-opacity-40 z-40"
    (click)="toggleMobileMenu()"
  ></div>

  <!-- Sidebar Panel -->
  <div
    *ngIf="mobileMenuOpen"
    class="fixed top-0 left-0 h-screen w-64 bg-white border-r border-gray-200 z-50 shadow-xl overflow-y-auto transition-transform duration-300 ease-in-out"
  >
    <!-- Logo -->
    <div class="flex flex-col items-center py-6 px-4">
      <img src="assets/images/immune-system.png" alt="PCIRM Logo" class="w-14 h-14 object-contain rounded-full bg-gradient-to-br from-gray-400 to-gray-200 border-4 border-white" />
      <h1 class="text-2xl font-black text-gray-800 mt-2">ADMIN PANEL</h1>
      <p class="text-base text-gray-600 text-center leading-relaxed font-bold mt-2">
        Web-Based Prenatal &amp;<br>
        Child Immunization Records<br>
        with SMS Notification
      </p>
    </div>
    <!-- Navigation -->
    <nav class="flex flex-col gap-2 px-4 pb-6">
      <button routerLink="/Admin/Dashboard"
        class="flex items-center px-4 py-3 text-gray-800 font-semibold bg-gradient-to-r from-gray-100 to-gray-300 hover:from-gray-200 hover:to-gray-400 transition-all shadow border border-gray-200 rounded">
        <span class="material-icons mr-2 text-gray-500">dashboard</span>
        Dashboard
      </button>
      <button routerLink="/Admin/Users" routerLinkActive="active"
        class="flex items-center px-4 py-3 text-gray-800 font-semibold bg-gradient-to-r from-gray-100 to-gray-300 hover:from-gray-200 hover:to-gray-400 transition-all shadow border border-gray-200 rounded">
        <span class="material-icons mr-2 text-gray-500">group</span>
        Users
      </button>
      <button routerLink="/Admin/Reports" routerLinkActive="active"
        class="flex items-center px-4 py-3 text-gray-800 font-semibold bg-gradient-to-r from-gray-200 to-gray-100 hover:from-gray-300 hover:to-gray-200 transition-all shadow border border-gray-300 rounded">
        <span class="material-icons mr-2 text-gray-500">bar_chart</span>
        Reports
      </button>
      <button (click)="logout()"
        class="flex items-center px-4 py-3 text-gray-600 hover:text-black font-semibold bg-gradient-to-r from-gray-200 to-gray-100 hover:from-gray-400 hover:to-gray-200 transition-all shadow border border-gray-300 rounded">
        <span class="material-icons mr-2 text-gray-600">logout</span>
        Signout
      </button>
    </nav>
  </div>
</div>
