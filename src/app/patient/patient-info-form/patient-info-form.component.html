<div class="max-w-lg mx-auto p-4 bg-white rounded shadow">
	<h2 class="text-2xl font-semibold mb-4">Patient Information</h2>

	<form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
		<div class="grid grid-cols-1 gap-3">
			<div>
				<label class="block text-sm font-medium">First name</label>
				<input formControlName="firstName" class="w-full border rounded px-2 py-1" />
				<div *ngIf="submitted && f.firstName.invalid" class="text-red-600 text-sm">First name is required</div>
			</div>

			<div>
				<label class="block text-sm font-medium">Middle name</label>
				<input formControlName="middleName" class="w-full border rounded px-2 py-1" />
			</div>

			<div>
				<label class="block text-sm font-medium">Last name</label>
				<input formControlName="lastName" class="w-full border rounded px-2 py-1" />
				<div *ngIf="submitted && f.lastName.invalid" class="text-red-600 text-sm">Last name is required</div>
			</div>

			<div class="flex gap-3">
				<div class="flex-1">
					<label class="block text-sm font-medium">Sex</label>
					<select formControlName="sex" class="w-full border rounded px-2 py-1">
						<option value="">Select</option>
						<option value="Female">Female</option>
						<option value="Male">Male</option>
						<option value="Other">Other</option>
					</select>
					<div *ngIf="submitted && f.sex.invalid" class="text-red-600 text-sm">Sex is required</div>
				</div>
				<div class="flex-1">
					<label class="block text-sm font-medium">Birth date</label>
					<input formControlName="birthDate" type="date" class="w-full border rounded px-2 py-1" />
					<div *ngIf="submitted && f.birthDate.invalid" class="text-red-600 text-sm">Birth date is required</div>
				</div>
			</div>

			<div>
				<label class="block text-sm font-medium">Address</label>
				<input formControlName="address" class="w-full border rounded px-2 py-1" />
			</div>

			<div>
				<label class="block text-sm font-medium">Phone / Contact</label>
				<input formControlName="phone" class="w-full border rounded px-2 py-1" />
				<div *ngIf="submitted && f.phone.invalid" class="text-red-600 text-sm">Phone is required (min 7 chars)</div>
			</div>

			<div>
				<label class="block text-sm font-medium">Guardian / Mother</label>
				<input formControlName="guardianName" class="w-full border rounded px-2 py-1" />
			</div>

			<div>
				<label class="block text-sm font-medium">Notes</label>
				<textarea formControlName="notes" class="w-full border rounded px-2 py-1"></textarea>
			</div>

			<div class="flex items-center gap-3 mt-2">
				<button type="submit" [disabled]="submitting" class="px-4 py-2 bg-blue-600 text-white rounded">{{ submitting ? 'Submitting...' : 'Submit' }}</button>
				<div *ngIf="message" class="text-green-700">{{ message }}</div>
			</div>
		</div>
	</form>
</div>
