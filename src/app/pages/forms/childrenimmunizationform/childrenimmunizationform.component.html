<body class="p-10 font-serif text-sm w-[210mm] min-h-[297mm] mx-auto bg-white" >
  <!-- Back button outside the form -->
<div class="mb-2">
  <button
    type="button"
    class="px-4 py-1 bg-gray-200 text-gray-700 rounded hover:bg-gray-300 transition font-semibold print:hidden"
    routerLink="/HCP/Immunization-Patients"
  >
    &#8592; Back
  </button>
</div>  <!-- Header -->


  <form #immunizationForm="ngForm" (ngSubmit)="onSubmit(immunizationForm)" id="print-section">
      <div class="text-center font-normal text-lg mb-10 mt-3">
    INDIVIDUAL TREATMENT RECORD FOR IMMUNIZATION AND SICK CHILDREN
  </div>
    <!-- Personal Info Section -->
    <div class="grid grid-cols-4 gap-2 text-xs mb-4">
      <div class="flex flex-col">
      <label for="name" class="mb-1 text-gray-700">Name</label>
      <input
        id="name"
        name="name"
        type="text"
        class="border p-1"
        [(ngModel)]="formData.name"
        required
        #name="ngModel"
        [ngClass]="{'border-red-500': name.invalid && (name.dirty || name.touched || showFormError)}"
        [title]="name.invalid && (name.dirty || name.touched || showFormError) ? 'Name is required.' : ''"
      />
      </div>
      <div class="flex flex-col">
      <div class="flex flex-row items-center gap-2">
        <div class="flex flex-col" style="width: 60px;">
          <label for="ageYears" class="mb-1 text-gray-700">Age (Years</label>
          <input
            id="ageYears"
            name="ageYears"
            type="number"
            class="border p-1"
            [(ngModel)]="formData.ageYears"
            readonly
            #ageYears="ngModel"
            [ngClass]="{'border-red-500': ageYears.invalid && (ageYears.dirty || ageYears.touched || showFormError)}"
            [title]="ageYears.invalid && (ageYears.dirty || ageYears.touched) ? 'Age in years is required.' : ''"
          />
        </div>
        <div class="flex flex-col" style="width: 60px;">
          <label for="ageMonths" class="mb-1 text-gray-700">& Month)</label>
          <input
            id="ageMonths"
            name="ageMonths"
            type="number"
            class="border p-1"
            [(ngModel)]="formData.ageMonths"
            readonly
            #ageMonths="ngModel"
            [ngClass]="{'border-red-500': ageMonths.invalid && (ageMonths.dirty || ageMonths.touched || showFormError)}"
            [title]="ageMonths.invalid && (ageMonths.dirty || ageMonths.touched) ? 'Age in months is required.' : ''"
          />
        </div>
      </div>
      </div>
      <div class="flex flex-col">
      <label for="birthday" class="mb-1 text-gray-700">Birthday</label>
      <input
        id="birthday"
        name="birthday"
        type="date"
        class="border p-1"
        [(ngModel)]="formData.birthday"
        required
        #birthday="ngModel"
        (change)="calculateAgeFromBirthday()"
        [ngClass]="{'border-red-500': birthday.invalid && (birthday.dirty || birthday.touched || showFormError)}"
        [title]="birthday.invalid && (birthday.dirty || birthday.touched) ? 'Birthday is required.' : ''"
      />
      </div>
      <div class="flex flex-col">
      <label for="address" class="mb-1 text-gray-700">Address</label>
      <input
        id="address"
        name="address"
        type="text"
        class="border p-1"
        [(ngModel)]="formData.address"
        required
        #address="ngModel"
        [ngClass]="{'border-red-500': address.invalid && (address.dirty || address.touched || showFormError)}"
        [title]="address.invalid && (address.dirty || address.touched) ? 'Address is required.' : ''"
      />
      </div>
      <div class="flex flex-col">
      <label for="bhw" class="mb-1 text-gray-700">BHW</label>
      <input
        id="bhw"
        name="bhw"
        type="text"
        class="border p-1"
        [(ngModel)]="formData.bhw"
        
        #bhw="ngModel"
        [ngClass]="{'border-red-500': bhw.invalid && (bhw.dirty || bhw.touched || showFormError)}"
        [title]="bhw.invalid && (bhw.dirty || bhw.touched) ? 'You have just refreshed the form.\nBHW is required.\nIf this field is not populated, \nplease return to the previous page \nand revisit this form to refresh your session.' : ''"
        
      />
      </div>
      <div class="flex flex-col">
      <label for="philhealth" class="mb-1 text-gray-700">PhilHealth No.</label>
      <input
        id="philhealth"
        name="philhealth"
        type="text"
        class="border p-1"
        [(ngModel)]="formData.philhealth"
        
        #philhealth="ngModel"
        [ngClass]="{'border-red-500': philhealth.invalid && (philhealth.dirty || philhealth.touched )}"
        [title]="philhealth.invalid && (philhealth.dirty || philhealth.touched) ? 'PhilHealth No. is required.' : ''"
      />
      </div>
      <div class="flex flex-col">
      <label for="contact" class="mb-1 text-gray-700">Contact No.</label>
      <input
        id="contact"
        name="contact"
        type="text"
        class="border p-1"
        [(ngModel)]="formData.contact"
        required
        pattern="^09[0-9]{9}$"
        maxlength="11"
        inputmode="numeric"
        autocomplete="off"
        #contact="ngModel"
        (keypress)="allowOnlyNumbers($event)"
        [ngClass]="{'border-red-500': contact.invalid && (contact.dirty || contact.touched || showFormError)}"
        [title]="contact.invalid && (contact.dirty || contact.touched) ? 'Please enter a valid Philippine mobile number (e.g., 09XXXXXXXXX).' : ''"
      />
      </div>
      <div class="flex flex-col">
      <label for="mother" class="mb-1 text-gray-700">Mother's Name</label>
      <input
        id="mother"
        name="mother"
        type="text"
        class="border p-1"
        [(ngModel)]="formData.mother"
        required
        #mother="ngModel"
        [ngClass]="{'border-red-500': mother.invalid && (mother.dirty || mother.touched || showFormError)}"
        [title]="mother.invalid && (mother.dirty || mother.touched) ? 'Mother\'s Name is required.' : ''"
      />
      </div>
      <div class="flex flex-col">
      <label for="placeofdelivery" class="mb-1 text-gray-700">Place of Delivery</label>
      <input
        id="placeofdelivery"
        name="placeofdelivery"
        type="text"
        class="border p-1"
        [(ngModel)]="formData.placeofdelivery"
        required
        #placeofdelivery="ngModel"
        [ngClass]="{'border-red-500': placeofdelivery.invalid && (placeofdelivery.dirty || placeofdelivery.touched || showFormError)}"
        [title]="placeofdelivery.invalid && (placeofdelivery.dirty || placeofdelivery.touched) ? 'Place of Delivery is required.' : ''"
      />
      </div>
      <div class="flex flex-col">
      <label for="weight" class="mb-1 text-gray-700">Weight</label>
      <input
        id="weight"
        name="weight"
        type="number"
        class="border p-1"
        [(ngModel)]="formData.weight"
        required
        #weight="ngModel"
        [ngClass]="{'border-red-500': weight.invalid && (weight.dirty || weight.touched || showFormError)}"
        [title]="weight.invalid && (weight.dirty || weight.touched) ? 'Weight is required.' : ''"
      />
      </div>
      <div class="flex flex-col">
      <label for="height" class="mb-1 text-gray-700">Height</label>
      <input
        id="height"
        name="height"
        type="number"
        class="border p-1"
        [(ngModel)]="formData.height"
        required
        #height="ngModel"
        [ngClass]="{'border-red-500': height.invalid && (height.dirty || height.touched || showFormError)}"
        [title]="height.invalid && (height.dirty || height.touched) ? 'Height is required.' : ''"
      />
      </div>
    </div>

    <!-- Immunization Table -->
    <div class="border border-gray-300 text-xs">
      <div *ngFor="let vaccine of vaccines" class="grid grid-cols-4 border-t border-gray-300">
      <!-- Vaccine Name and Schedule -->
      <div class="border border-gray-300 p-2 font-semibold text-center">
        {{ vaccine.name }}<br />
        <span class="font-normal">{{ vaccine.schedule }}</span>
      </div>

      <!-- Generate Slot Inputs -->
      <div
        *ngFor="let slot of [].constructor(vaccine.slots); let i = index"
        class="border border-gray-300 p-2 flex flex-col gap-1"
      >
        <div class="flex flex-col">
          <label [for]="vaccine.id + '-date-' + (i + 1)" class="mb-1 text-gray-700">Date</label>
          <input
            [id]="vaccine.id + '-date-' + (i + 1)"
            [name]="vaccine.id + '-date-' + (i + 1)"
            type="date"
            class="border px-1 py-0.5"
            [(ngModel)]="formData.vaccines[vaccine.id][i].date"
            [ngModelOptions]="{standalone: true}"
          />
        </div>
        <div class="flex flex-col">
          <label [for]="vaccine.id + '-sig-' + (i + 1)" class="mb-1 text-gray-700">Sig</label>
          <input
            [id]="vaccine.id + '-sig-' + (i + 1)"
            [name]="vaccine.id + '-sig-' + (i + 1)"
            type="text"
            class="border px-1 py-0.5"
            [(ngModel)]="formData.vaccines[vaccine.id][i].sig"
            [ngModelOptions]="{standalone: true}"
          />
        </div>
        <div class="flex flex-col">
          <label [for]="vaccine.id + '-remarks-' + (i + 1)" class="mb-1 text-gray-700">Remarks</label>
          <textarea
            [id]="vaccine.id + '-remarks-' + (i + 1)"
            [name]="vaccine.id + '-remarks-' + (i + 1)"
            class="border px-1 py-0.5"
            [(ngModel)]="formData.vaccines[vaccine.id][i].remarks"
            [ngModelOptions]="{standalone: true}"
          ></textarea>
        </div>
      </div>

      <!-- Fill empty cell if less than 3 columns -->
      <div
        *ngIf="vaccine.slots < 3"
        [attr.colspan]="3 - vaccine.slots"
        class="border border-gray-300 p-2"
      ></div>
      </div>
    </div>
      <div class="flex justify-start items-center mb-1">
      <span class="text-xs text-gray-600 font-medium">
        {{ now | date:'fullDate' }} {{ now | date:'shortTime' }}
      </span>
    </div>
    <!-- Submit Button -->
    <div class="flex justify-end mt-8">
<button
  type="button"
  class="px-6 py-2 bg-blue-600 cursor-pointer text-white rounded-lg shadow hover:bg-blue-700 transition font-semibold print:hidden"
  (click)="printAndSaveOrUpdateITR(immunizationForm)"
  [disabled]="immunizationForm.invalid"
>
  {{ childId ? 'Update & Print' : 'Save & Print' }}
</button>
    </div>
  </form>
  <!-- Modal -->
<div *ngIf="showModal" class="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50">
  <div class="bg-white rounded-lg shadow-lg p-8 flex flex-col items-center gap-4 min-w-[320px] border-2"
       [ngClass]="{
         'border-green-500': modalType === 'success',
         'border-yellow-500': modalType === 'warning',
         'border-red-500': modalType === 'error',
         'border-blue-500': modalType === 'info'
       }">
    <div *ngIf="modalType === 'success'" class="text-green-600 text-4xl mb-2">&#10003;</div>
    <div *ngIf="modalType === 'error'" class="text-red-600 text-4xl mb-2">&#10060;</div>
    <div *ngIf="modalType === 'warning'" class="text-yellow-600 text-4xl mb-2">&#9888;</div>
    <div *ngIf="modalType === 'info'" class="text-blue-600 text-4xl mb-2">&#8505;</div>
    <div class="text-lg font-semibold text-center"
         [ngClass]="{
           'text-green-700': modalType === 'success',
           'text-yellow-700': modalType === 'warning',
           'text-red-700': modalType === 'error',
           'text-blue-700': modalType === 'info'
         }">
      {{ modalMessage }}
    </div>
    <div class="text-xs text-gray-500 text-center">Redirecting...</div>
  </div>
</div>
<!-- Spinner Overlay -->
<div *ngIf="isLoading || message"
     class="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50">
  <div class="bg-white rounded-lg shadow-lg p-6 flex flex-col items-center gap-4 min-w-[300px]">
    <div *ngIf="isLoading" class="flex flex-col items-center gap-2">
      <svg class="animate-spin h-8 w-8 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path>
      </svg>
      <span class="text-blue-700 font-semibold">Processing...</span>
    </div>
    <div *ngIf="message"
         [ngClass]="{
           'text-green-700': messageType === 'success',
           'text-yellow-700': messageType === 'warning',
           'text-red-700': messageType === 'error',
           'text-blue-700': messageType === 'info'
         }"
         class="text-center font-medium">
      {{ message }}
    </div>
  </div>
</div>
</body>

<style>
@media print {
  body {
    background: white !important;
  }
  .print-a4 {
    width: 210mm !important;
    min-height: 297mm !important;
    box-shadow: none !important;
    margin: 0 auto !important;
    border: none !important;
  }
  .print\:hidden {
    display: none !important;
  }
}
</style>
