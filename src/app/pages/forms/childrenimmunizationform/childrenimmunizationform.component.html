<div class="p-10 font-serif text-sm w-[210mm] min-h-[297mm] mx-auto bg-white print-a4">


  <!-- Header -->
  <form #immunizationForm="ngForm" (ngSubmit)="onSubmit(immunizationForm)" id="print-section">
    <div class="text-center font-normal text-lg mb-10 mt-3">
      INDIVIDUAL TREATMENT RECORD FOR IMMUNIZATION AND SICK CHILDREN
    </div>

    <!-- Personal Info Section -->
    <div class="grid grid-cols-4 gap-2 text-xs mb-4">
      <!-- Name -->
      <div class="flex flex-col">
        <label for="name" class="mb-1 text-gray-700">Name</label>
        <input
          id="name"
          name="name"
          type="text"
          class="border p-1"
          [(ngModel)]="formData.name"
          required
          #name="ngModel"
          [ngClass]="{'border-red-500': name.invalid && (name.dirty || name.touched || showFormError)}"
        />
      </div>

      <!-- Age -->
      <div class="flex flex-col">
        <div class="flex flex-row items-center gap-2">
          <div class="flex flex-col w-[60px]">
            <label for="ageYears" class="mb-1 text-gray-700">Age (Years)</label>
            <input
              id="ageYears"
              name="ageYears"
              type="number"
              class="border p-1 bg-gray-100"
              [(ngModel)]="formData.ageYears"
              readonly
            />
          </div>
          <div class="flex flex-col w-[60px]">
            <label for="ageMonths" class="mb-1 text-gray-700">& Month)</label>
            <input
              id="ageMonths"
              name="ageMonths"
              type="number"
              class="border p-1 bg-gray-100"
              [(ngModel)]="formData.ageMonths"
              readonly
            />
          </div>
        </div>
      </div>

      <!-- Birthday -->
      <div class="flex flex-col">
        <label for="birthday" class="mb-1 text-gray-700">Birthday</label>
        <input
          id="birthday"
          name="birthday"
          type="date"
          class="border p-1"
          [(ngModel)]="formData.birthday"
          required
          #birthday="ngModel"
          (change)="calculateAgeFromBirthday()"
          [ngClass]="{'border-red-500': birthday.invalid && (birthday.dirty || birthday.touched || showFormError)}"
        />
      </div>

      <!-- Address -->
      <div class="flex flex-col">
        <label for="address" class="mb-1 text-gray-700">Address</label>
        <input
          id="address"
          name="address"
          type="text"
          class="border p-1"
          [(ngModel)]="formData.address"
          required
          #address="ngModel"
          [ngClass]="{'border-red-500': address.invalid && (address.dirty || address.touched || showFormError)}"
        />
      </div>

      <!-- BHW -->
      <div class="flex flex-col">
        <label for="bhw" class="mb-1 text-gray-700">BHW</label>
        <input
          id="bhw"
          name="bhw"
          type="text"
          class="border p-1"
          [(ngModel)]="formData.bhw"
          #bhw="ngModel"
        />
      </div>

      <!-- PhilHealth -->
      <div class="flex flex-col">
        <label for="philhealth" class="mb-1 text-gray-700">PhilHealth No.</label>
        <input
          id="philhealth"
          name="philhealth"
          type="text"
          class="border p-1"
          [(ngModel)]="formData.philhealth"
          #philhealth="ngModel"
        />
      </div>

      <!-- Contact -->
      <div class="flex flex-col">
        <label for="contact" class="mb-1 text-gray-700">Contact No.</label>
        <input
          id="contact"
          name="contact"
          type="text"
          class="border p-1"
          [(ngModel)]="formData.contact"
          required
          pattern="^09[0-9]{9}$"
          maxlength="11"
          inputmode="numeric"
          autocomplete="off"
          #contact="ngModel"
          [ngClass]="{'border-red-500': contact.invalid && (contact.dirty || contact.touched || showFormError)}"
        />
      </div>

      <!-- Mother -->
      <div class="flex flex-col">
        <label for="mother" class="mb-1 text-gray-700">Mother's Name</label>
        <input
          id="mother"
          name="mother"
          type="text"
          class="border p-1"
          [(ngModel)]="formData.mother"
          required
          #mother="ngModel"
          [ngClass]="{'border-red-500': mother.invalid && (mother.dirty || mother.touched || showFormError)}"
        />
      </div>

      <!-- Place of Delivery -->
      <div class="flex flex-col">
        <label for="placeofdelivery" class="mb-1 text-gray-700">Place of Delivery</label>
        <input
          id="placeofdelivery"
          name="placeofdelivery"
          type="text"
          class="border p-1"
          [(ngModel)]="formData.placeofdelivery"
          required
          #placeofdelivery="ngModel"
          [ngClass]="{'border-red-500': placeofdelivery.invalid && (placeofdelivery.dirty || placeofdelivery.touched || showFormError)}"
        />
      </div>

      <!-- Weight -->
      <div class="flex flex-col">
        <label for="weight" class="mb-1 text-gray-700">Weight</label>
        <input
          id="weight"
          name="weight"
          type="number"
          class="border p-1"
          [(ngModel)]="formData.weight"
          required
          #weight="ngModel"
          [ngClass]="{'border-red-500': weight.invalid && (weight.dirty || weight.touched || showFormError)}"
        />
      </div>

      <!-- Height -->
      <div class="flex flex-col">
        <label for="height" class="mb-1 text-gray-700">Height</label>
        <input
          id="height"
          name="height"
          type="number"
          class="border p-1"
          [(ngModel)]="formData.height"
          required
          #height="ngModel"
          [ngClass]="{'border-red-500': height.invalid && (height.dirty || height.touched || showFormError)}"
        />
      </div>
    </div>

    <!-- Immunization Table -->
    <div class="border border-gray-300 text-xs">
      <div *ngFor="let vaccine of vaccines" class="grid grid-cols-4 border-t border-gray-300">
        <!-- Vaccine -->
        <div class="border border-gray-300 p-2 font-semibold text-center">
          {{ vaccine.name }}<br />
          <span class="font-normal">{{ vaccine.schedule }}</span>
        </div>

        <!-- Slots -->
        <div
          *ngFor="let slot of [].constructor(vaccine.slots); let i = index"
          class="border border-gray-300 p-2 flex flex-col gap-1"
        >
          <div class="flex flex-col">
            <label [for]="vaccine.id + '-date-' + (i + 1)" class="mb-1 text-gray-700">Date</label>
            <input
              [id]="vaccine.id + '-date-' + (i + 1)"
              type="date"
              class="border px-1 py-0.5"
              [(ngModel)]="formData.vaccines[vaccine.id][i].date"
              [ngModelOptions]="{standalone: true}"
            />
          </div>
          <div class="flex flex-col">
            <label [for]="vaccine.id + '-sig-' + (i + 1)" class="mb-1 text-gray-700">Sig</label>
            <input
              [id]="vaccine.id + '-sig-' + (i + 1)"
              type="text"
              class="border px-1 py-0.5"
              [(ngModel)]="formData.vaccines[vaccine.id][i].sig"
              [ngModelOptions]="{standalone: true}"
            />
          </div>
          <div class="flex flex-col">
            <label [for]="vaccine.id + '-remarks-' + (i + 1)" class="mb-1 text-gray-700">Remarks</label>
            <textarea
              [id]="vaccine.id + '-remarks-' + (i + 1)"
              class="border px-1 py-0.5"
              [(ngModel)]="formData.vaccines[vaccine.id][i].remarks"
              [ngModelOptions]="{standalone: true}"
            ></textarea>
          </div>
        </div>
      </div>
    </div>

    <!-- Timestamp -->
    <div class="flex justify-start items-center mb-1">
      <span class="text-xs text-gray-600 font-medium">
        {{ now | date:'fullDate' }} {{ now | date:'shortTime' }}
      </span>
    </div>

    <!-- Submit -->
    <div class="flex justify-end mt-8">
      <button
        type="button"
        class="px-6 py-2 bg-blue-600 cursor-pointer text-white rounded-lg shadow hover:bg-blue-700 transition font-semibold print:hidden"
        (click)="printAndSaveOrUpdateITR(immunizationForm)"
        [disabled]="immunizationForm.invalid"
      >
        {{ childId ? 'Update & Print' : 'Save & Print' }}
      </button>
    </div>
  </form>
</div>
