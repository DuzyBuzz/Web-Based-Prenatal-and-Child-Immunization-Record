<div class="max-w-xl mx-auto mt-10 bg-white rounded-lg shadow-lg p-8">
  <h2 class="text-2xl font-bold text-black mb-6 text-center">Account Settings</h2>
  <form [formGroup]="accountForm" (ngSubmit)="updateAccount()" class="space-y-5">
    <div>
      <label class="block font-medium mb-1 text-black">Username</label>
      <input type="text" formControlName="username" class="w-full border border-black rounded px-3 py-2 text-black bg-white" placeholder="Username">
    </div>
    <div>
      <label class="block font-medium mb-1 text-black">Name</label>
      <input type="text" formControlName="name" class="w-full border border-black rounded px-3 py-2 text-black bg-white" placeholder="Full Name">
    </div>
    <div>
      <label class="block font-medium mb-1 text-black">Current Password <span class="text-red-500">*</span></label>
      <input type="password" formControlName="currentPassword" class="w-full border border-black rounded px-3 py-2 text-black bg-white" placeholder="Current Password" required>
    </div>
    <div>
      <label class="block font-medium mb-1 text-black">New Password</label>
      <input type="password" formControlName="newPassword" class="w-full border border-black rounded px-3 py-2 text-black bg-white" placeholder="New Password">
    </div>
    <div>
      <label class="block font-medium mb-1 text-black">Confirm New Password</label>
      <input type="password" formControlName="confirmPassword" class="w-full border border-black rounded px-3 py-2 text-black bg-white" placeholder="Confirm New Password">
    </div>

    <button type="submit" [disabled]="accountForm.invalid || loading" class="w-full py-3 bg-black text-white rounded font-semibold hover:bg-gray-900 transition">
      Save Changes
    </button>
  </form>
</div>
