<div class="max-w-7xl mx-auto p-6">
  <h2 class="text-3xl font-bold text-gray-800 mb-8 text-start tracking-tight">Reports</h2>

  <!-- Filter controls -->
  <div class="mb-6 grid grid-cols-1 md:grid-cols-4 gap-3 items-end">
    <div>
      <label class="text-sm font-medium text-gray-700">Date Field</label>
      <select [(ngModel)]="dateField" class="w-full border p-2 rounded">
        <option value="createdDate">Created Date</option>
        <option value="createdAt">Created Timestamp</option>
        <option value="nextPrenatal">Prenatal Schedule</option>
        <option value="SecondWednesdayNextMonth">Immunization Schedule</option>
        <option value="birthday">Birthday</option>
      </select>
    </div>
    <div>
      <label class="text-sm font-medium text-gray-700">Start Date</label>
      <input type="date" [(ngModel)]="startDate" class="w-full border p-2 rounded" />
    </div>
    <div>
      <label class="text-sm font-medium text-gray-700">End Date</label>
      <input type="date" [(ngModel)]="endDate" class="w-full border p-2 rounded" />
    </div>
    <div class="flex gap-2">
      <button class="px-4 py-2 bg-blue-600 text-white rounded" (click)="applyFilters()">Apply</button>
      <button class="px-4 py-2 bg-gray-300 rounded" (click)="clearFilters()">Clear</button>
    </div>
  </div>

  <div class="flex flex-wrap justify-end mb-6 gap-3">
    <button
      type="button"
      class="px-5 py-2 bg-gray-800 text-white rounded-lg shadow hover:bg-black transition font-semibold flex items-center gap-2"
      (click)="downloadExcel('itr')"
    >
      <span class="material-icons text-white text-base">download</span>
      Download Prenatal Records
    </button>
    <button
      type="button"
      class="px-5 py-2 bg-gray-700 text-white rounded-lg shadow hover:bg-black transition font-semibold flex items-center gap-2"
      (click)="downloadExcel('immunization')"
    >
      <span class="material-icons text-white text-base">download</span>
      Download Immunization Records
    </button>
  </div>

  <!-- ITR Table -->
  <div class="mb-12">
    <h3 class="text-xl font-semibold text-gray-800 mb-4 border-b border-gray-300 pb-2">Prenatal (ITR) Records</h3>
    <div class="overflow-x-auto rounded-lg shadow min-h-[120px] bg-white">
      <ng-container *ngIf="itrLoading; else itrLoaded">
        <div class="text-center py-8 text-gray-500">Loading...</div>
      </ng-container>
      <ng-template #itrLoaded>
        <table class="min-w-full border-separate border-spacing-0">
          <thead class="bg-gray-100">
            <tr>
              <th *ngFor="let h of getItrHeaders()" class="px-4 py-3 border-b text-left font-semibold">{{ headerLabel(h) }}</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let item of itrFiltered" class="hover:bg-gray-50 transition">
              <td *ngFor="let h of getItrHeaders()" class="px-4 py-2 border-b">{{ formatCell(item[h]) }}</td>
            </tr>
          </tbody>
        </table>
        <ng-container *ngIf="itrFiltered.length === 0">
          <div class="text-center py-8 text-gray-400">No records found.</div>
        </ng-container>
      </ng-template>
    </div>
  </div>

  <!-- Immunization Table -->
  <div>
    <h3 class="text-xl font-semibold text-gray-800 mb-4 border-b border-gray-300 pb-2">Immunization Records</h3>
    <div class="overflow-x-auto rounded-lg shadow min-h-[120px] bg-white">
      <ng-container *ngIf="immunizationLoading; else immunizationLoaded">
        <div class="text-center py-8 text-gray-500">Loading...</div>
      </ng-container>
      <ng-template #immunizationLoaded>
        <table class="min-w-full border-separate border-spacing-0">
          <thead class="bg-gray-100">
            <tr>
              <th *ngFor="let h of getImmunizationHeaders()" class="px-4 py-3 border-b text-left font-semibold">{{ headerLabel(h) }}</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let item of immunizationFiltered" class="hover:bg-gray-50 transition">
              <td *ngFor="let h of getImmunizationHeaders()" class="px-4 py-2 border-b">{{ formatCell(item[h]) }}</td>
            </tr>
          </tbody>
        </table>
        <ng-container *ngIf="immunizationFiltered.length === 0">
          <div class="text-center py-8 text-gray-400">No records found.</div>
        </ng-container>
      </ng-template>
    </div>
  </div>
</div>
