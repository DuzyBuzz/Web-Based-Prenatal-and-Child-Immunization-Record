<!-- Sidebar for desktop and tablet -->
<div
  class="hidden md:flex flex-col fixed top-0 left-0 h-screen w-64 bg-white border-r border-gray-200 z-50 overflow-y-auto"
  [class.filter]="blur"
  [class.blur-sm]="blur"
>
  <!-- Logo -->
  <div class="flex flex-col items-center py-6 px-4">
    <img
      src="assets/images/immune-system.png"
      alt="PCIRM Logo"
      class="w-14 h-14 object-contain rounded-full bg-gradient-to-br from-gray-400 to-gray-200 shadow-xl border-4 border-white"
    />
    <p class="text-base text-gray-700 text-center leading-relaxed font-bold mt-4">
      Web-Based Prenatal &amp;<br>
      Child Immunization Records<br>
      with SMS Notification
    </p>
    <!-- Display logged-in user name -->
    <div *ngIf="name" class="mt-4 text-gray-800 font-semibold text-center text-base">
      {{ name }}
    </div>
  </div>
  <!-- Navigation -->
  <nav class="flex-1 flex flex-col justify-between px-4 pb-6">
    <div class="flex flex-col gap-2">
      <button routerLink="/HCP/appointments"
        class="flex items-center px-4 py-3 text-black font-semibold bg-gray-100 hover:bg-gray-200 transition-all shadow border border-gray-300 rounded">
        <span class="material-icons mr-2 text-black">event</span>
        Appointments
      </button>
      <button routerLink="/HCP/Prenatal-Patients" routerLinkActive="active"
        class="flex items-center px-4 py-3 text-black font-semibold bg-gray-100 hover:bg-gray-200 transition-all shadow border border-gray-300 rounded">
        <span class="material-icons mr-2 text-black">pregnant_woman</span>
        Prenatal
      </button>
      <button routerLink="/HCP/Immunization-Patients" routerLinkActive="active"
        class="flex items-center px-4 py-3 text-black font-semibold bg-gray-100 hover:bg-gray-200 transition-all shadow border border-gray-300 rounded">
        <span class="material-icons mr-2 text-black">vaccines</span>
        Immunization
      </button>
      <button routerLink="/HCP/Reports" routerLinkActive="active"
        class="flex items-center px-4 py-3 text-black font-semibold bg-gray-100 hover:bg-gray-200 transition-all shadow border border-gray-300 rounded">
        <span class="material-icons mr-2 text-black">bar_chart</span>
        Reports
      </button>
    </div>
    <div class="flex flex-col gap-2 mt-8">
      <button routerLink="/HCP/Settings" routerLinkActive="active"
        class="flex items-center px-4 py-3 text-black font-semibold bg-gray-200 hover:bg-gray-300 transition-all shadow border border-gray-400 rounded">
        <span class="material-icons mr-2 text-black">settings</span>
        Settings
      </button>
      <button (click)="logout()"
        class="flex items-center px-4 py-3 text-black hover:text-gray-700 font-semibold bg-gray-100 hover:bg-gray-200 transition-all shadow border border-gray-300 rounded">
        <span class="material-icons mr-2 text-black">logout</span>
        Signout
      </button>
    </div>
  </nav>
</div>

<!-- Sidebar for mobile -->
<div class="md:hidden">
  <!-- Sidebar Toggle Button -->
  <button
    (click)="toggleMobileMenu()"
    class="fixed top-2 left-2 z-50 bg-gray-700 text-white p-2 rounded-full shadow-lg flex items-center justify-center"
    aria-label="Toggle navigation"
  >
    <img src="assets/images/immune-system.png" alt="Menu" class="w-6 h-6 object-contain" />
  </button>

  <!-- Overlay -->
  <div
    *ngIf="mobileMenuOpen"
    class="fixed inset-0 bg-black bg-opacity-40 z-40"
    (click)="toggleMobileMenu()"
  ></div>

  <!-- Sidebar Panel -->
  <div
    *ngIf="mobileMenuOpen"
    class="fixed top-0 left-0 h-screen w-64 bg-white border-r border-gray-200 z-50 shadow-xl overflow-y-auto transition-transform duration-300 ease-in-out"
  >
    <!-- Logo -->
    <div class="flex flex-col items-center py-6 px-4">
      <img src="assets/images/immune-system.png" alt="PCIRM Logo" class="w-14 h-14 object-contain rounded-full bg-gradient-to-br from-gray-400 to-gray-200 border-4 border-white" />
      <p class="text-base text-gray-700 text-center leading-relaxed font-bold mt-4">
        Web-Based Prenatal &amp;<br>
        Child Immunization Records<br>
        with SMS Notification
      </p>
    <!-- Display logged-in user name -->
    <div *ngIf="name" class="mt-4 text-gray-800 font-semibold text-center text-base">
      {{ name }}
    </div>
    </div>
    <!-- Navigation -->
    <nav class="flex flex-col gap-2 px-4 pb-6">
      <button routerLink="/HCP/appointments"
        class="flex items-center px-4 py-3 text-black font-semibold bg-gray-100 hover:bg-gray-200 transition-all shadow border border-gray-300 rounded">
        <span class="material-icons mr-2 text-black">event</span>
        Appointments
      </button>
      <button routerLink="/HCP/Prenatal-Patients" routerLinkActive="active"
        class="flex items-center px-4 py-3 text-black font-semibold bg-gray-100 hover:bg-gray-200 transition-all shadow border border-gray-300 rounded">
        <span class="material-icons mr-2 text-black">pregnant_woman</span>
        Prenatal
      </button>
      <button routerLink="/HCP/Immunization-Patients" routerLinkActive="active"
        class="flex items-center px-4 py-3 text-black font-semibold bg-gray-100 hover:bg-gray-200 transition-all shadow border border-gray-300 rounded">
        <span class="material-icons mr-2 text-black">vaccines</span>
        Immunization
      </button>
      <button routerLink="/HCP/Reports" routerLinkActive="active"
        class="flex items-center px-4 py-3 text-black font-semibold bg-gray-100 hover:bg-gray-200 transition-all shadow border border-gray-300 rounded">
        <span class="material-icons mr-2 text-black">bar_chart</span>
        Reports
      </button>
      <button routerLink="/HCP/Settings" routerLinkActive="active"
        class="flex items-center px-4 py-3 text-black font-semibold bg-gray-200 hover:bg-gray-300 transition-all shadow border border-gray-400 rounded">
        <span class="material-icons mr-2 text-black">settings</span>
        Settings
      </button>
      <button (click)="logout()"
        class="flex items-center px-4 py-3 text-black hover:text-gray-700 font-semibold bg-gray-100 hover:bg-gray-200 transition-all shadow border border-gray-300 rounded">
        <span class="material-icons mr-2 text-black">logout</span>
        Signout
      </button>
    </nav>
  </div>
</div>
