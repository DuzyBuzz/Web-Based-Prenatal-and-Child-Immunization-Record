<div class="flex min-h-screen bg relative">

  <!-- Left Side - Background Image Section -->
  <div
    class="relative flex-col items-center justify-center p-12 text-center text-slate-200 bg-cover bg-no-repeat rounded-lg shadow-2xl w-5/6 hidden md:flex"
    style="background-image: url('assets/images/loginbg.jpg');">
  </div>

  <!-- Right Side - Login Form -->
  <div class="w-full md:w-1/2 flex flex-col justify-center items-center p-12 bg-blue-600 bg-cover border-gray-200"
    style="background-image: url('assets/images/therm.jpg');">

    <!-- Image Container -->
    <div class="w-48 flex justify-center mb-6 rounded-3xl">
      <img src="assets/images/immune-system.png" alt="Immune System" class="h-auto">
    </div>

    <h2 class="text-5xl font-extrabold mb-4 text-teal-700 text-center">
      Web-Based Prenatal and Child Immunization Record
    </h2>

    <h3 class="text-2xl font-normal mb-6 text-teal-800 text-center">
      with SMS Notification
    </h3>

    <p class="text-wrap text-gray-600 mb-20 text-center">
      A powerful and secure immunization tracking system designed for efficiency, compliance, and patient care.
    </p>
    <p class="text-gray-500 mb-6 font-black">Login</p>

    <!-- Tabs: HCP / Patient -->
    <div class="mb-4 w-72 flex justify-center">
      <div class="inline-flex bg-white rounded-lg shadow" role="tablist" aria-label="Login type">
        <button (click)="switchTab('hcp')" [attr.aria-selected]="activeTab==='hcp'"
          class="px-4 py-2 rounded-l-lg focus:outline-none" [ngClass]="activeTab==='hcp' ? 'bg-blue-600 text-white' : 'text-gray-700'">HCP</button>
        <button (click)="switchTab('patient')" [attr.aria-selected]="activeTab==='patient'"
          class="px-4 py-2 rounded-r-lg focus:outline-none" [ngClass]="activeTab==='patient' ? 'bg-emerald-500 text-white' : 'text-gray-700'">Patient</button>
      </div>
    </div>

    <!-- HCP / Admin login -->
    <form *ngIf="activeTab==='hcp'" (ngSubmit)="loginWithEmail()" class="mb-6 w-60 bg-white rounded-lg shadow p-4">
      <label for="username" class="block text-gray-700 font-semibold mb-2">Username</label>
      <input id="username" [(ngModel)]="username" name="username" type="text"
        class="w-full border border-gray-300 rounded px-3 py-2 mb-3 focus:outline-none focus:ring-2 focus:ring-blue-400" required />

      <label for="password" class="block text-gray-700 font-semibold mb-2">Password</label>
      <input id="password" [(ngModel)]="password" name="password" type="password"
        class="w-full border border-gray-300 rounded px-3 py-2 mb-3 focus:outline-none focus:ring-2 focus:ring-blue-400" required />

      <button type="submit" [disabled]="loading"
        class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition">
        Login
      </button>
    </form>

    <!-- Patient quick register/login: single input + button for patients -->
    <div *ngIf="activeTab==='patient'" class="w-72 bg-white rounded-lg shadow p-4 text-center">
      <p class="text-sm text-gray-600 mb-3 font-semibold">Patient: sign up or sign in</p>
      <form (ngSubmit)="continueAsPatient()" class="flex flex-col gap-2">
        <input [(ngModel)]="patientFullName" name="patientFullName" required placeholder="Full name" class="w-full border rounded px-2 py-1" />
        <input [(ngModel)]="patientPhone" name="patientPhone" required placeholder="Phone number" class="w-full border rounded px-2 py-1" />
        <label class="flex items-center text-sm gap-2"><input type="checkbox" [(ngModel)]="patientHasAccount" name="patientHasAccount" /> I already have an account</label>
        <div class="flex gap-2">
          <button type="submit" [disabled]="patientLoading" class="flex-1 inline-block px-3 py-2 bg-emerald-500 text-white rounded hover:bg-emerald-600 transition">{{ patientHasAccount ? 'Sign in' : 'Sign up' }}</button>
        </div>
        <div *ngIf="patientMessage" [ngClass]="patientMessage.includes('found') ? 'text-red-600' : 'text-green-700'" class="text-sm mt-2">{{ patientMessage }}</div>
      </form>
      <!-- OTP verification UI -->
      <div *ngIf="otpRequested" class="mt-3 text-left">
        <label class="block text-sm font-semibold mb-1">Enter OTP</label>
        <div class="flex gap-2">
          <input [(ngModel)]="otpInput" name="otpInput" placeholder="6-digit code" class="flex-1 border rounded px-2 py-1" />
          <button type="button" (click)="verifyOtp()" [disabled]="otpSending" class="px-3 py-1 bg-blue-600 text-white rounded">Verify</button>
        </div>
        <div class="flex gap-2 mt-2">
          <button type="button" (click)="resendOtp()" [disabled]="otpSending" class="px-3 py-1 bg-gray-200 rounded">Resend</button>
        </div>
        <div *ngIf="otpError" class="text-red-600 text-sm mt-2">{{ otpError }}</div>
      </div>
    </div>

  </div>

  <app-spinnner
    [navigating]="navigating"
    [spinnerMessage]="spinnerMessage">
  </app-spinnner>

</div>
