<div class="flex min-h-screen bg relative"> <!-- Add relative for spinner overlay -->

  <!-- Left Side - Background Image Section -->
  <div
    class="relative flex flex-col items-center justify-center p-12 text-center text-slate-200 bg-cover bg-no-repeat rounded-lg shadow-2xl w-5/6 hidden md:flex"
    style="background-image: url('assets/images/loginbg.jpg');">
  </div>

  <!-- Right Side - Login Form -->
  <div class="w-full md:w-1/2 flex flex-col justify-center items-center p-12 bg-blue-600 bg-cover border-gray-200"
    style="background-image: url('assets/images/therm.jpg');">

    <!-- Image Container -->
    <div class="w-48 flex justify-center mb-6 rounded-3xl">
      <img src="assets/images/immune-system.png" alt="Immune System" class="h-auto"
        [routerLink]="['/setup-user']" routerLinkActive="router-link-active">
    </div>

    <h2 class="text-5xl font-extrabold mb-4 text-teal-700 text-center">
      Web-Based Prenatal and Child Immunization Records
    </h2>

    <h3 class="text-2xl font-normal mb-6 text-teal-800 text-center">
      with SMS Notification
    </h3>

    <p class="text-wrap text-gray-600 mb-20 text-center">
      A powerful and secure immunization tracking system designed for efficiency, compliance, and patient care.
    </p>
    <p class="text-gray-500 mb-6 font-black">Choose Login Method</p>
    <p class="text-gray-500 mb-3 font-medium">Login For Health Care Provider</p>

    <!-- Google Sign-In Button -->
    <button (click)="loginWithGoogle()"
      class="flex items-center justify-center mb-6 w-60 p-3 rounded-lg border border-gray-300 bg-white text-gray-700 font-medium hover:bg-gray-100 transition-all shadow-sm"
      [disabled]="loading">
      <img src="assets/images/google.png" class="w-10 h-10 mr-3" alt="Google">
      <span *ngIf="!loading">Sign in with Google</span>
      <span *ngIf="loading">Signing in...</span>
    </button>
    <p class="text-gray-500 mb-1 font-medium">Login for Patient</p>
    <!-- Facebook Sign-In Button -->
    <button (click)="loginWithPhone()"
      class="flex items-center justify-center w-60 p-3 mt-4 rounded-lg border border-blue-500 bg-blue-600 text-white font-medium hover:bg-blue-700 transition-all shadow-sm"
      [disabled]="loading">

      <img src="assets/images/telephone.png" class="w-8 h-8 mr-3" alt="Telephone">
      Sign in with Phone
    </button>

    <div *ngIf="showPhoneAuth" class="mt-6 w-60 bg-white rounded-lg shadow p-4">
      <label for="phone" class="block text-gray-700 font-semibold mb-2">Phone Number</label>
      <input id="phone" [(ngModel)]="phoneNumber" type="tel" placeholder="+639XXXXXXXXX" 
        class="w-full border border-gray-300 rounded px-3 py-2 mb-3 focus:outline-none focus:ring-2 focus:ring-blue-400" />

      <div id="recaptcha-container" class="mb-3"></div>

      <div *ngIf="!otpSent">
        <button (click)="sendOtp()" [disabled]="loading || !phoneNumber"
          class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition mb-2">
          Send OTP
        </button>
      </div>

      <div *ngIf="otpSent">
        <label for="otp" class="block text-gray-700 font-semibold mb-2">Enter OTP</label>
        <input id="otp" [(ngModel)]="otp" type="text" maxlength="6"
          class="w-full border border-gray-300 rounded px-3 py-2 mb-3 focus:outline-none focus:ring-2 focus:ring-blue-400" />
        <button (click)="verifyOtp()" [disabled]="loading || !otp"
          class="w-full bg-green-600 text-white py-2 rounded hover:bg-green-700 transition">
          Verify OTP
        </button>
      </div>
    </div>
  </div>

<app-spinnner
[navigating]="navigating"
[spinnerMessage]="spinnerMessage">

</app-spinnner>


</div>
