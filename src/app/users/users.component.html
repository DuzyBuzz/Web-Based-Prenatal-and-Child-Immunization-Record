<div class="min-h-screen w-full flex flex-col bg-slate-200 text-gray-800"
>
  <!-- Layout Grid -->
  <div class="flex flex-1 overflow-hidden bg-slate-200 bg-cover bg-opacity-100"
>
    <!-- Left Side Panel -->
     <div *ngIf="showLayout" class="flex min-h-screen bg-slate-200 rounded-lg">
      <app-left-side-panel></app-left-side-panel>

     </div>

    <!-- Main Content (Router Outlet Container) -->
    <main class="flex-1 flex flex-col overflow-hidden "
    >
      <div class="flex-1 overflow-y-auto  p-6"
      >
      <div class="flex">
  <!-- Main Content -->
  <div [ngClass]="{'min-h-screen bg-gray-50 transition-all duration-300 md:ml-64': showLayout, 'w-full': !showLayout}" class="flex-1">
        <router-outlet></router-outlet>
      </div>
        </div>
</div>
    </main>



  </div>

</div>
